name: CI  on:   push:     branches: [main]   pull_request:  permissions:   contents: read  jobs:   quality:     runs-on: ubuntu-latest     env:       RAG_LEGACY_REFERENCE_ROOT: .r0-reference       RAG_TEST_DATABASE_URL: postgresql+psycopg://rag:rag@localhost:5432/rag_test     services:       postgres:         image: postgres:17-alpine         env:           POSTGRES_USER: rag           POSTGRES_PASSWORD: rag           POSTGRES_DB: rag_test         ports:           - 5432:5432         options: >-           --health-cmd "pg_isready -U rag -d rag_test"           --health-interval 5s           --health-timeout 5s           --health-retries 10     steps:       - uses: actions/checkout@v5       - name: Checkout pinned legacy reference         uses: actions/checkout@v5         with:           repository: haonanhu02-jpg/ragflow-agent           ref: ce74c58e664275ff239bcbb8c841771bc4649557           path: .r0-reference       - uses: astral-sh/setup-uv@v6         with:           version: "0.11.21"           enable-cache: true       - uses: actions/setup-python@v6         with:           python-version: "3.13"       - name: Install locked dependencies         run: uv sync --frozen --all-groups       - name: Lint         run: uv run ruff check --no-cache .       - name: Strict type check         run: uv run mypy       - name: Architecture and greenfield gates         run: uv run python scripts/check_architecture.py       - name: R0 compatibility baseline         run: uv run python scripts/check_r0_baseline.py       - name: R1 foundation gate         run: uv run python scripts/check_r1_foundation.py       - name: Tests         run: uv run pytest -q --cov --cov-report=term-missing       - name: Dependency audit         run: uv run pip-audit       - name: Secret hygiene         shell: bash         run: |           if git grep -nEI '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|gh[pousr]_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,})' -- . ':!uv.lock'; then             echo 'Potential secret found.' >&2             exit 1           fi