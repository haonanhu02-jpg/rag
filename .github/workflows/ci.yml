name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      RAG_LEGACY_REFERENCE_ROOT: .r0-reference
      RAG_TEST_DATABASE_URL: postgresql+psycopg://rag:rag@localhost:5432/rag_test
      RAG_TEST_ELASTICSEARCH_URL: http://localhost:9200
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.1.2
        env:
          discovery.type: single-node
          xpack.security.enabled: false
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - name: Checkout pinned legacy reference
        uses: actions/checkout@v5
        with:
          repository: haonanhu02-jpg/ragflow-agent
          ref: ce74c58e664275ff239bcbb8c841771bc4649557
          path: .r0-reference
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.21"
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install locked dependencies
        run: uv sync --frozen --all-groups
      - name: Install OCR runtime
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - name: Lint
        run: uv run ruff check --no-cache .
      - name: Strict type check
        run: uv run mypy
      - name: Architecture and greenfield gates
        run: uv run python scripts/check_architecture.py
      - name: R0 compatibility baseline
        run: uv run python scripts/check_r0_baseline.py
      - name: R1 foundation gate
        run: uv run python scripts/check_r1_foundation.py
      - name: R2 minimum RAG gate
        run: uv run python scripts/check_r2_vertical_slice.py
      - name: R3 document compiler gate
        run: uv run python scripts/check_r3_document_compiler.py
      - name: R4 authorized retrieval gate
        run: uv run python scripts/check_r4_authorized_retrieval.py
      - name: Tests
        run: uv run pytest -q --cov --cov-report=term-missing
      - name: Dependency audit
        run: uv run pip-audit
      - name: Secret hygiene
        shell: bash
        run: |
          if git grep -nEI '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|gh[pousr]_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,})' -- . ':!uv.lock'; then
            echo 'Potential secret found.' >&2
            exit 1
          fi
