schema_version: 1
baseline_id: rag-greenfield-r0
reference_lock: baselines/r0/reference-lock.json
new_repository_default_status: not_implemented_in_new_repo

contract_profiles:
  document_compilation:
    inputs: [tenant_scope, knowledge_base, document_bytes, media_type, compiler_options]
    outputs: [parsed_blocks, chunks, stable_ids, source_locations, warnings]
    invariants: [deterministic_order, stable_identity, bounded_resources, source_provenance]
    errors: [unsupported_format, malformed_document, resource_limit, dependency_failure]
    security: [tenant_scope_required, archive_bomb_rejected, untrusted_input_isolated]
    performance: [page_limit, byte_limit, timeout, memory_budget]
  knowledge_enrichment:
    inputs: [authorized_chunks, model_profile, feature_flag, budget]
    outputs: [derived_knowledge, provenance, cost, decision]
    invariants: [source_bound, version_bound, deterministic_when_model_free]
    errors: [invalid_model_output, budget_exhausted, dependency_failure]
    security: [tenant_scope_required, source_authorization_preserved]
    performance: [token_budget, call_budget, timeout]
  retrieval:
    inputs: [authorization_context, knowledge_base_scope, query, filter, limits]
    outputs: [candidates, score_breakdown, evidence_state, trace_id]
    invariants: [hard_scope_never_relaxed, active_version_only, deterministic_ties]
    errors: [invalid_filter, dependency_failure, model_output_invalid]
    security: [cross_tenant_denied, acl_enforced, deleted_content_hidden]
    performance: [top_k_bound, rerank_window_bound, timeout]
  grounded_answer:
    inputs: [authorization_context, question, conversation, retrieval_options]
    outputs: [answer, evidence_state, citations, trace_id, stream_events]
    invariants: [citation_source_bound, no_evidence_is_not_error, authorized_evidence_only]
    errors: [model_failure, retrieval_failure, budget_exhausted, cancelled]
    security: [cross_tenant_denied, citation_revalidated, sensitive_trace_minimized]
    performance: [token_budget, model_timeout, total_timeout]
  lifecycle:
    inputs: [authorization_context, document_command, idempotency_key, expected_revision]
    outputs: [document_version, operation, progress, terminal_state]
    invariants: [immutable_versions, one_active_version, idempotent_effects, authority_in_postgres]
    errors: [conflict, transient_failure, permanent_failure, cancelled, dead_letter]
    security: [write_permission_required, delete_immediately_hidden, tenant_scoped_messages]
    performance: [bounded_retry, bounded_batch, reconciliation_limit]
  agent_runtime:
    inputs: [authorization_context, run_request, registered_tools, server_budget]
    outputs: [run_state, answer, citations, approval, trace]
    invariants: [bounded_loops, resumable_state, idempotent_side_effects, shared_retrieval_core]
    errors: [tool_denied, approval_expired, budget_exhausted, state_version_unsupported]
    security: [model_cannot_set_scope, tool_allowlist, resume_reauthorization, memory_consent]
    performance: [iteration_budget, tool_budget, token_budget, active_runtime_budget]
  platform_governance:
    inputs: [configuration, artifact, dataset, operational_command]
    outputs: [public_contract, metrics, audit_evidence, release_decision]
    invariants: [reproducible_build, explicit_limitations, database_is_authority]
    errors: [invalid_configuration, migration_failure, gate_failure, recovery_failure]
    security: [secret_hygiene, least_privilege, supply_chain_evidence]
    performance: [capacity_thresholds, slo_measurement, recovery_targets]

