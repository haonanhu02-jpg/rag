repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --no-cache .
        language: system
        pass_filenames: false
      - id: mypy
        name: strict mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
      - id: r0-baseline
        name: R0 compatibility baseline
        entry: uv run python scripts/check_r0_baseline.py
        language: system
        pass_filenames: false
