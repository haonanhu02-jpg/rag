[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "rag-platform"
version = "0.1.0"
description = "A greenfield, compatibility-driven RAG platform."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.18,<2",
    "fastapi>=0.128,<1",
    "langchain-core>=1.2,<2",
    "langgraph>=1.0,<2",
    "pgvector>=0.4,<1",
    "psycopg[binary]>=3.3,<4",
    "python-multipart>=0.0.22,<1",
    "pyyaml>=6.0.2,<7",
    "sqlalchemy>=2.0.46,<3",
    "uvicorn>=0.40,<1",
]

[project.scripts]
rag-api = "rag_platform.bootstrap.api:main"
rag-worker = "rag_platform.bootstrap.worker:main"
rag-maintainer = "rag_platform.bootstrap.maintainer:main"

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pip-audit>=2.9,<3",
    "pytest>=8.4,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.12,<1",
    "types-pyyaml>=6.0.12,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rag_platform"]

[tool.pytest.ini_options]
minversion = "8.4"
addopts = ["--strict-config", "--strict-markers", "-ra"]
testpaths = ["tests"]
pythonpath = ["."]
xfail_strict = true

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = ["src"]
files = ["src", "scripts", "tests"]
pretty = true
show_error_codes = true
warn_unreachable = true

[tool.coverage.run]
branch = true
source = ["rag_platform"]

[tool.coverage.report]
fail_under = 90
show_missing = true
